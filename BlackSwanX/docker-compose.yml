version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: resonance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep max 2 models loaded (llama3.2:3b + nomic-embed-text)
      # Prevents VRAM thrash when jury/panel + embeddings run concurrently
      - OLLAMA_MAX_LOADED_MODELS=2
      # Serial inference — prevents GPU OOM from parallel LLM calls
      - OLLAMA_NUM_PARALLEL=1
      # Longer keep-alive so models stay warm between extraction stages
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # On macOS with Apple Silicon, remove the deploy section above
    # Ollama uses Metal/unified memory automatically — env vars still apply

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resonance-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./backend:/app/backend
      - db_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resonance-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ollama_data:
  db_data:
