# Postgres + VectorChord (bundles pgvector). The store uses pgvector multi-vector
# today; VectorChord's native MaxSim is the documented scale-up. Port 5433 on the
# host to avoid clashing with a local Postgres on 5432 (matches DATABASE_URL).
services:
  db:
    image: tensorchord/vchord-suite:pg17-latest
    container_name: legatum-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: legatum
      POSTGRES_PASSWORD: legatum
      POSTGRES_DB: legatum_rag
    ports:
      - "5433:5432"
    volumes:
      - legatum_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legatum -d legatum_rag"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  legatum_rag_pgdata:
