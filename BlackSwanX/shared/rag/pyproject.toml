[project]
name = "legatum-rag"
version = "0.1.0"
description = "MateScale RAG — multimodal + knowledge-graph RAG on Postgres"
readme = "README.md"
authors = [
    { name = "legatum-team", email = "team@legatum.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "colpali-engine>=0.3.17",
    "fastapi>=0.138.0",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=4.2.5",
    "langchain-openai>=1.3.2",
    "numpy>=2.4.6",
    "openai>=2.43.0",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdfium2>=5.10.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.49.0",
]
[project.scripts]
legatum-rag = "legatum_rag.main:run"
legatum-rag-initdb = "legatum_rag.db:run_initdb"
legatum-rag-ingest = "legatum_rag.ingest_cli:run_ingest_cli"
legatum-rag-eval = "legatum_rag.evaluate:run_eval_cli"
[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "legatum_rag"
module-root = "src"
